<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Novo Usuário</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="pagina">

        <div class="sidebar">
            <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
            <div>
                <ul>
                    <li><a href="pets.html">Pet</a></li>
                    <li><a href="usuarios.html" class="ativo">Usuários</a></li>
                    <li><a href="configuracoes.html">Configurações</a></li>
                    <li><a href="reservas.html">Reservas</a></li>
                </ul>
            </div>
        </div>

        <div class="conteudo">

            <div class="topo">
                <div class="perfil">
                    <img src="img/perfil.png" alt="Foto de perfil">
                    <span>João da Silva</span>
                </div>
            </div>

            <div class="breadcrumb">Home / Usuário / Novo usuário</div>

            <div class="main">
                <h2>Novo Usuário</h2>

                <form action="usuarios.html" method="get">

                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>

                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="sobrenome">Sobrenome</label>
                    <input type="text" id="sobrenome" name="sobrenome">

                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" required>

                    <label for="funcao">Função</label>
                    <select id="funcao" name="funcao">
                        <option value="cliente">Cliente</option>
                        <option value="funcionario">Funcionário</option>
                        <option value="gerente">Gerente</option>
                    </select>

                    <label for="foto">Foto</label>
                    <input type="file" id="foto" name="foto">

                    <button type="submit">Salvar</button>
                    <button type="reset">Limpar</button>

                </form>
            </div>

        </div>

    </div>

</body>
</html>
