    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="pagina">

        <div class="sidebar">
            <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
            <div>
                <ul>
                    <li><a href="pets.html" class="ativo">Pet</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>

        </div>

        <div class="conteudo">

            <div class="main">

                <form class="filtros">
                    <div>
                        <label for="id">Id</label>
                        <input type="text" id="id" name="id">
                    </div>
                    <div>
                        <label for="nome">nome</label>

                    </div>
                    <div>
                        <label for="raca">raça</label>
                        <input type="text" id="raca" name="raca">
                    </div>
                    <div>
                        <label for="tamanho">tamanho</label>
                        <input type="text" id="tamanho" name="tamanho">
                    </div>
                    <button type="submit">Pesquisar</button>
                    <button type="reset">Limpar</button>
                </form>

                <table>
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>nome</th>
                            <th>tipo</th>
                            <th>raça</th>
                            <th>tamanho</th>

                    <tbody>

                            <td>12349984501</td>

                        </tr>
                        <tr>
                            <td>12349984501</td>
                            <td>Ginger</td>

                            <td>Pequeno</td>
                            <td><a href="editar-pet.html">Editar</a> <a href="visualizar-pet.html">Visualizar</a></td>
                        </tr>
                    </tbody>
