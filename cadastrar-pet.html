<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Novo Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="pagina">

        <div class="sidebar">
            <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
            <div>
                <ul>
                    <li><a href="pets.html" class="ativo">Pet</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="configuracoes.html">Configurações</a></li>
                    <li><a href="reservas.html">Reservas</a></li>
                </ul>
            </div>
        </div>

        <div class="conteudo">

            <div class="topo">
                <div class="perfil">
                    <img src="img/perfil.png" alt="Foto de perfil">
                    <span>João da Silva</span>
                </div>
            </div>

            <div class="breadcrumb">Home / Pet / Novo Pet</div>

            <div class="main">
                <h2>Novo Pet</h2>

                <form action="pets.html" method="get">

                    <label for="proprietario">Proprietário *</label>
                    <input type="text" id="proprietario" name="proprietario" required>

                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="tipo">Tipo *</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="cachorro">Cachorro</option>
                        <option value="gato">Gato</option>
                        <option value="outro">Outro</option>
                    </select>

                    <label for="raca">Raça *</label>
                    <input type="text" id="raca" name="raca" required>

                    <label for="tamanho">Tamanho *</label>
                    <select id="tamanho" name="tamanho" required>
                        <option value="">Selecione</option>
                        <option value="pequeno">Pequeno</option>
                        <option value="medio">Médio</option>
                        <option value="grande">Grande</option>
                    </select>

                    <label for="imagem">Imagem</label>
                    <input type="file" id="imagem" name="imagem">

                    <button type="submit">Salvar</button>
                    <button type="reset">Limpar</button>

                </form>
            </div>

        </div>

    </div>

    <script src="js/dados.js"></script>
    <script src="js/comum.js"></script>
    <script src="js/pets.js"></script>
</body>
</html>
