<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">

        <div class="login-imagem">
            <img src="img/login-banner.jpg" alt="Hotel Pet">
        </div>

        <div class="login-formulario">
            <h1 class="logo">Hotel Pet</h1>

            <form action="reservas.html" method="get">

                <label for="login">Login</label>
                <input type="text" id="login" name="login" placeholder="Login">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha">

                <div class="linha-checkbox">
                    <input type="checkbox" id="manter-conectado" name="manter-conectado">
                    <label for="manter-conectado">Mantenha-me conectado</label>
                    <a href="#">Esqueci a senha</a>
                </div>

                <button type="submit">Enviar</button>

            </form>

            <p class="divisor">ou</p>

            <div class="icones-sociais">
                <a href="#"><img src="img/facebook.png" alt="Entrar com Facebook"></a>
                <a href="#"><img src="img/twitter.png" alt="Entrar com Twitter"></a>
                <a href="#"><img src="img/google.png" alt="Entrar com Google"></a>
            </div>

            <a href="criar-conta.html" class="link-criar-conta">Criar uma conta</a>

        </div>

    </div>

    <script src="js/dados.js"></script>
    <script src="js/comum.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
