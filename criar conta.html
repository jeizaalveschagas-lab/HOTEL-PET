<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Criar Conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">

        <div class="login-imagem">
            <img src="img/login-banner.jpg" alt="Hotel Pet">
        </div>

        <div class="login-formulario">
            <h1 class="logo">Hotel Pet</h1>

            <form action="reservas.html" method="get">

                <label for="login">Login</label>
                <input type="text" id="login" name="login" placeholder="Login">

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha">

                <button type="submit">Criar conta</button>

            </form>

            <a href="login.html" class="link-criar-conta">Já tem conta? Login</a>

        </div>

    </div>

</body>
</html>
