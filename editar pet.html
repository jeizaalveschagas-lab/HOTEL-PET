<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="pagina">

        <div class="sidebar">
            <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
            <div>
                <ul>
                    <li><a href="pets.html" class="ativo">Pet</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="configuracoes.html">Configurações</a></li>
                    <li><a href="reservas.html">Reservas</a></li>
                </ul>
            </div>
        </div>

        <div class="conteudo">

            <div class="topo">
                <div class="perfil">
                    <img src="img/perfil.png" alt="Foto de perfil">
                    <span>João da Silva</span>
                </div>
            </div>

            <div class="breadcrumb">Home / Pet / Editar Pet</div>

            <div class="main">
                <h2>Editar Pet</h2>

                <form action="visualizar-pet.html" method="get">

                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" value="Max" required>

                    <label for="tipo">Tipo *</label>
                    <select id="tipo" name="tipo" required>
                        <option value="cachorro" selected>Cachorro</option>
                        <option value="gato">Gato</option>
                        <option value="outro">Outro</option>
                    </select>

                    <label for="raca">Raça *</label>
                    <input type="text" id="raca" name="raca" value="Pastor Alemão" required>

                    <label for="tamanho">Tamanho *</label>
                    <select id="tamanho" name="tamanho" required>
                        <option value="pequeno">Pequeno</option>
                        <option value="medio">Médio</option>
                        <option value="grande" selected>Grande</option>
                    </select>

                    <label for="imagem">Imagem</label>
                    <input type="file" id="imagem" name="imagem">

                    <button type="submit">Salvar</button>
                    <button type="reset">Limpar</button>

                </form>
            </div>

        </div>

    </div>

</body>
</html>
