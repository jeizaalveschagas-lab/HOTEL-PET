<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Pet - Editar Reserva</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="pagina">

        <div class="sidebar">
            <h1 class="logo"><a href="reservas.html">Hotel Pet</a></h1>
            <div>
                <ul>
                    <li><a href="pets.html">Pet</a></li>
                    <li><a href="usuarios.html">Usuários</a></li>
                    <li><a href="configuracoes.html">Configurações</a></li>
                    <li><a href="reservas.html" class="ativo">Reservas</a></li>
                </ul>
            </div>
        </div>

        <div class="conteudo">

            <div class="topo">
                <div class="perfil">
                    <img src="img/perfil.png" alt="Foto de perfil">
                    <span>João da Silva</span>
                </div>
            </div>

            <div class="breadcrumb">Home / reservas / editar reserva</div>

            <div class="main">
                <h2>Editar reserva</h2>

                <form action="reservas.html" method="get">

                    <label for="proprietario">Proprietário *</label>
                    <input type="text" id="proprietario" name="proprietario" value="José da Silva" required>

                    <label for="pet">Pet *</label>
                    <input type="text" id="pet" name="pet" value="Max" required>

                    <label for="periodo-de">Período *</label>
                    <input type="date" id="periodo-de" name="periodo-de" value="2021-05-02" required>
                    <input type="date" id="periodo-ate" name="periodo-ate" value="2021-05-07" required>

                    <label for="notas">Notas</label>
                    <textarea id="notas" name="notas">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</textarea>

                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="em-andamento">Em andamento</option>
                        <option value="cancelado">Cancelado</option>
                        <option value="finalizado">Finalizado</option>
                        <option value="reservado">Reservado</option>
                    </select>

                    <label for="anotacoes-funcionario">Anotações do funcionário</label>
                    <textarea id="anotacoes-funcionario" name="anotacoes-funcionario"></textarea>

                    <label for="imagens">Imagens</label>
                    <input type="file" id="imagens" name="imagens" multiple>

                    <p class="total">Total das diárias: <strong>R$ 40,00</strong></p>

                    <a href="#" class="botao-secundario">Adicionar nota fiscal</a>
                    <a href="#">recibo.pdf</a>

                    <button type="submit">Salvar</button>
                    <button type="reset">Limpar</button>

                </form>
            </div>

        </div>

    </div>

</body>
</html>
